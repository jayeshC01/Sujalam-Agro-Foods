spring.application.name=Sujalam Agro Foods Backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.open-in-view=false

# App Properties
spring.jackson.default-property-inclusion=NON_NULL

# Include the per-request correlation id (see RequestLoggingFilter) in every log line
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n

# Actuator & Health Probes (for Cloud Run / Kubernetes / Load Balancers)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# Auto-expand nested models/schemas so you don't have to manually click to expand each field
springdoc.swagger-ui.default-model-expand-depth=3
springdoc.swagger-ui.default-models-expand-depth=2
# Keep endpoints organized in clean collapsible list groups by tag
springdoc.swagger-ui.doc-expansion=list
# Adds an instant search/filter bar at the top of Swagger UI
springdoc.swagger-ui.filter=true
# Auto-enables "Try it out" mode without needing to click the button every time
springdoc.swagger-ui.try-it-out-enabled=true
# Displays request timing and duration
springdoc.swagger-ui.display-request-duration=true
# Direct access enabled locally by default; require authentication in prod (APP_SWAGGER_PUBLIC=false)
app.swagger.public=${APP_SWAGGER_PUBLIC:true}




